<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IS AI Chat</title>

    <link href="client/css/bootstrap.min.css" rel="stylesheet" />
    <link href="client/css/bootstrap-icons.css" rel="stylesheet" />
    <link href="client/css/styles.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="chat-container">
        <div class="card chat-card">
          <!-- =========================
                 HEADER
            ========================== -->

          <div class="chat-header">
            <!-- Heading -->
            <div class="chat-title mb-2">
              <h5 class="mb-0">
                <i class="bi bi-robot me-2"></i> AI Assistant
              </h5>
            </div>
            <!-- Controls -->
            <div
              id="radioBtnsDiv"
              class="d-flex justify-content-end align-items-center"
            >
              <button id="clearChatBtn" class="btn btn-sm btn-primary">
                Clear
              </button>
            </div>
          </div>

          <!-- =========================
                 CHAT BODY
            ========================== -->

          <div id="chatBody" class="chat-body">
            <div class="message-row ai">
              <div class="message">
                <div class="message-label">
                  <i class="bi bi-robot me-1"></i>
                  AI Assistant
                </div>
                <div class="ai-content">Hello! How can I help you today?</div>
              </div>
            </div>
          </div>
          <div id="voiceContainer" class="voice-area d-none">
            <div class="voice-orb-wrapper">
              <div id="voiceOrb" class="voice-orb">
              </div>
            </div>
          </div>
          <div id="audioContainer"></div>
          <!-- =========================
                 FOOTER
            ========================== -->

          <div class="chat-footer">
            <!-- Thinking -->

            <div id="thinkingContainer" class="thinking-container">
              <span id="thinkingText" class="thinking"> AI is thinking </span>
            </div>

            <!-- Input -->

            <div class="input-group">
              <input
                type="text"
                id="txtMessage"
                class="form-control"
                placeholder="Type your message..."
                autocomplete="off"
                maxlength="250"
              />

              <!-- Microphone -->

              <button
                type="button"
                class="btn btn-outline-secondary"
                id="connectBtn"
                title="Connect"
              >
                <span
                  id="connectBtnSpinner"
                  class="spinner-border spinner-border-sm d-none"
                  role="status"
                  aria-hidden="true"
                ></span>
                <span id="connectBtnTxt" class="btn-text"
                  ><i class="bi bi-mic-fill"></i
                ></span>
              </button>

              <button
                type="button"
                class="btn btn-secondary d-none"
                id="micMuteUnmuteBtn"
                title="Mute/Unmute"
              >
               <i class="bi bi-mic-mute"></i>
              </button>

              <!-- Disconnect -->
              <button
                type="button"
                class="btn btn-outline-secondary d-none"
                id="disconnectBtn"
                title="Disconnect"
              >
                <i class="bi bi-x-lg"></i>
              </button>

              <!-- Send -->
              <button
                type="button"
                class="btn btn-primary"
                id="btnSend"
                title="Send"
              >
                <i class="bi bi-send-fill"></i>
              </button>
            </div>
            <div class="mt-2">
              <span id="errorTxt" class="text-danger small"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="client/js/libs/bootstrap.bundle.min.js"></script>
    <script src="client/js/libs/jquery.min.js"></script>
    <script src="client/js/libs/livekit-client.umd.min.js"></script>
    <script src="client/js/libs/marked.min.js"></script>
    <script src="client/js/app.js"></script>
  </body>
</html>
